services:
  postgresql:
    image: postgres:16
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123456
      # Doctor 端作为默认库，其余库通过 initdb 脚本创建（见 deploy/postgres_init）
      POSTGRES_DB: doctor_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d doctor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-backend

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - ./kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - hospital-backend

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - hospital-backend

  nurse:
    build:
      context: ../nurse
      args:
        APK_MIRROR: https://mirrors.aliyun.com/alpine
        UV_DEFAULT_INDEX: https://mirrors.bfsu.edu.cn/pypi/web/simple/
    container_name: nurse
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app123456@postgresql:5432/nurse_db
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      DIFY_CHATFLOW_KEY: app-topvjFEEhXxjWfhL4z4xyHyk
      DIFY_SERVER: http://119.29.163.179
    expose:
      - "8000"
    networks:
      - hospital-backend

  administrator:
    build:
      context: ../administrator
      args:
        APK_MIRROR: https://mirrors.aliyun.com/alpine
        UV_DEFAULT_INDEX: https://mirrors.bfsu.edu.cn/pypi/web/simple/
    container_name: administrator
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app123456@postgresql:5432/administrator_db
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    expose:
      - "8000"
    networks:
      - hospital-backend

  doctor:
    build:
      context: ../doctor
      args:
        APK_MIRROR: https://mirrors.aliyun.com/alpine
        UV_DEFAULT_INDEX: https://mirrors.bfsu.edu.cn/pypi/web/simple/
    container_name: doctor
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app123456@postgresql:5432/doctor_db
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      REDIS_URL: redis://redis:6379/0
      DIFY_SERVER: http://119.29.163.179
      DIFY_CT_WORKFLOW_KEY: app-9nfUMy8fBm9GZ53lQuhGeJzR
    expose:
      - "8000"
    networks:
      - hospital-backend

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_BACKEND_ADMINISTRATOR: /api/administrator
        VITE_BACKEND_NURSE: /api/nurse
        VITE_BACKEND_DOCTOR: /api/doctor
        VITE_BACKEND_CUSTOMER: /api/customer
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - nurse
      - administrator
      - doctor
    ports:
      - "8082:80"
    networks:
      - hospital-backend

networks:
  hospital-backend:
